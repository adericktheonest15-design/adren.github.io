<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Adren Private School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="registration-container">
        <div class="school-header">
            <h2>Adren Private School</h2>
            <p>Education for liberation</p>
            <h3>Student Admission form</h3>
        </div>

        <form id="registrationForm" novalidate>
            <div class="form-grid">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required placeholder="e.g., Allen">
                </div>

                <div class="form-group">
                    <label for="secondName">Second Name</label>
                    <input type="text" id="secondName" name="secondName" placeholder="e.g., ntoleine (Optional)">
                </div>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required placeholder="e.g., jovinary">
            </div>

            <div class="form-group">
                <label for="password">Portal Password</label>
                <input type="password" id="password" name="password" required placeholder="Create a secure password">
                <small class="hint">Must be at least 8 characters long.</small>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="form-group">
                <label for="homeAddress">Home Address</label>
                <textarea id="homeAddress" name="homeAddress" rows="3" required placeholder="Street address, City, State, Zip Code"></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Application</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
